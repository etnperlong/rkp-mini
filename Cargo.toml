[package]
name = "rkp-mini"
version = "0.1.0"
edition = "2021"
description = "Qualcomm KeyMint CSR_V2 (0x3122) RKP keybox issuer for KernelSU"
license = "MIT"

[[bin]]
name = "rkp-mini"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
anyhow = "1"
base64 = "0.22"
ciborium = "0.2"
der = "0.7"
libc = "0.2"
libloading = "0.8"
p256 = { version = "0.13", features = ["ecdsa", "pem", "pkcs8"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "macros"] }
toml = "0.8"
ureq = { version = "2.10", features = ["tls"] }
x509-cert = "0.2"
hex = "0.4"

[dev-dependencies]
rcgen = "0.13"
tempfile = "3"

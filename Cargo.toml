[workspace]
resolver = "2"
members = [
    "crates/rkp-mini-issuer",
    "crates/rkp-mini-core",
    "crates/rkp-mini-runtime",
    "crates/rkp-mini-sync",
    "crates/rkp-mini-sync-core",
    "crates/rkp-mini-deployer",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# scrypt (age passphrase KDF) is unusably slow unoptimized; keep debug builds
# and host tests practical without changing release behaviour.
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.chacha20poly1305]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3

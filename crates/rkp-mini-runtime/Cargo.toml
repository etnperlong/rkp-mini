[package]
name = "rkp-mini-runtime"
version = "0.1.0"
edition = "2021"
description = "rkp-mini runtime: config, targets, context, output, lock, tty (no network, no age)"
license = "MIT"

[dependencies]
rkp-mini-core = { path = "../rkp-mini-core" }
anyhow = "1"
libc = "0.2"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"

[dev-dependencies]
tempfile = "3"

[package]
name = "rkp-mini-sync-core"
version = "0.3.0"
edition = "2021"
description = "rkp-mini sync core: age envelope, CBOR manifest, sync protocol, secret files, transports"
license = "MIT"

[dependencies]
rkp-mini-core = { path = "../rkp-mini-core" }
age = { version = "0.12", default-features = false, features = ["armor"] }
anyhow = "1"
ciborium = "0.2"
hex = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zeroize = "1"

[dev-dependencies]
rkp-mini-core = { path = "../rkp-mini-core", features = ["test-support"] }
tempfile = "3"

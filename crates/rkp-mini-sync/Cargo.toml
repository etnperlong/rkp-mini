[package]
name = "rkp-mini-sync"
version = "0.2.0"
edition = "2021"
description = "Encrypted keybox sync (age + Gist/WebDAV/HTTPS): sender push and receiver fetch"
license = "MIT"

[[bin]]
name = "rkp-mini-sync"
path = "src/main.rs"

[dependencies]
rkp-mini-core = { path = "../rkp-mini-core" }
rkp-mini-runtime = { path = "../rkp-mini-runtime" }
rkp-mini-sync-core = { path = "../rkp-mini-sync-core" }
anyhow = "1"
base64 = "0.22"
hex = "0.4"
libc = "0.2"
qrcode = { version = "0.14", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2.10", features = ["tls"] }
url = "2"
zeroize = "1"

[dev-dependencies]
tempfile = "3"

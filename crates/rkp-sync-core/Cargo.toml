[package]
name = "rkp-sync-core"
version = "0.1.0"
edition = "2021"
description = "rkp-sync core: age envelope, CBOR manifest, URL scheme, strict keybox validation, state"
license = "MIT"

[dependencies]
age = { version = "0.12", default-features = false, features = ["armor"] }
anyhow = "1"
base64 = "0.22"
ciborium = "0.2"
der = "0.7"
hex = "0.4"
libc = "0.2"
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
x509-cert = "0.2"
zeroize = "1"

[dev-dependencies]
p256 = { version = "0.13", features = ["ecdsa", "pem", "pkcs8"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rcgen = "0.13"
tempfile = "3"
time = "0.3"
